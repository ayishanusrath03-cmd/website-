header{

    text-align:center;
    padding:20px;
}
.container{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    margin:20px;
}
.card{
    background:white;
    width:250px;
    margin:15px;
    border-radius:10px;
    box-shadow:0 0 10px gray;
    text-align:center;
    overflow:hidden;
} 
.card img{
    width:100%;
    height:180px;
}
.card h3{
    margin:10px;
}
.card p{
    color:green;
    font-size:18px;
}
button{
    background:#ff5722;
    color:white;
    border:none;
    padding:10px 20px;
    margin:15px;
    border-radius:5px;
    cursor:pointer;
}
button:hover{
    background:#e64a19;
}
footer{
    background:#333;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:20px;
}
</style>

</head>
